<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
  <title id="t">麦麦营养管家：一次查询发生了什么</title>
  <desc id="d">数据流图：用户输入 → 麦当劳官方 MCP 四类调用 → 规则引擎五步 → 三张可解释方案；底部为三道安全闸门。</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
</defs>

  <rect x="0" y="0" width="1000" height="620" style="fill:#ffffff" />

  <text  x="500" y="42" text-anchor="middle" style="font:600 23px/1.3 'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif; fill:#0f172a">麦麦营养管家 · 一次查询发生了什么</text>
  <text x="500" y="66" text-anchor="middle" style="font:400 13px/1.3 'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif; fill:#64748b">数值与约束由结构化规则计算，模型只负责理解意图与措辞 —— 这是它和「让 AI 随便推荐一个」的根本区别</text>

  <!-- 列 1：输入 -->
  <rect x="24" y="92" width="252" height="196" rx="10" style="fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.5" />
  <text x="44" y="118" style="font:600 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#334155; letter-spacing:.02em">你给什么</text>
  <text x="44" y="146" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">预算　　¥35</text>
  <text x="44" y="172" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">偏好　　均衡 / 蛋白 / 预算</text>
  <text x="44" y="198" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">门店　　城市 + 关键词</text>
  <text x="44" y="224" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">忌口　　可选（触发过敏闸）</text>
  <text x="44" y="258" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">全离线也能跑：仓库内置</text>
  <text x="44" y="275" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">一次真实调用的脱敏留档</text>

  <line x1="282" y1="190" x2="314" y2="190" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 列 2：官方 MCP -->
  <rect x="320" y="92" width="336" height="196" rx="10" style="fill:#eff6ff; stroke:#bfdbfe; stroke-width:1.5" />
  <text x="340" y="118" style="font:600 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#334155; letter-spacing:.02em">官方 MCP 取什么（麦当劳中国）</text>
  <text x="340" y="146" style="font:400 12px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace; fill:#1e40af">query-meals</text>
  <text x="500" y="146" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">该门店当前菜单</text>
  <text x="340" y="172" style="font:400 12px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace; fill:#1e40af">query-meal-detail</text>
  <text x="500" y="172" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">套餐展开为组件</text>
  <text x="340" y="198" style="font:400 12px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace; fill:#1e40af">list-nutrition-foods</text>
  <text x="500" y="198" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">官方营养表</text>
  <text x="340" y="224" style="font:400 12px ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace; fill:#1e40af">calculate-price</text>
  <text x="500" y="224" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">官方计价（留收据）</text>
  <text x="340" y="258" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">近四成菜单是套餐，而官方营养表只有单品</text>
  <text x="340" y="275" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">⇒ 必须逐件展开、匹配、再求和</text>

  <line x1="662" y1="190" x2="694" y2="190" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 列 3：输出 -->
  <rect x="700" y="92" width="276" height="196" rx="10" style="fill:#f0fdf4; stroke:#bbf7d0; stroke-width:1.5" />
  <text x="720" y="118" style="font:600 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#334155; letter-spacing:.02em">你得到什么</text>
  <text x="720" y="146" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">三张方案，视角各不相同</text>
  <text x="720" y="172" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">均衡优先 · 预算优先 · 蛋白优先</text>
  <text x="720" y="204" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">每项数值都带来源标记</text>
  <text x="720" y="228" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">官方字段 / 官方求和 / 暂缺</text>
  <text x="720" y="256" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">每个金额都带价源</text>
  <text x="720" y="278" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">已核实 / 未核实 / 推算</text>

  <line x1="500" y1="288" x2="500" y2="316" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 规则引擎 -->
  <rect x="24" y="322" width="952" height="120" rx="10" style="fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.5" />
  <text x="44" y="348" style="font:600 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#334155; letter-spacing:.02em">规则引擎（五步，全程不交给模型算数）</text>

  <rect x="44" y="362" width="164" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="126" y="386" text-anchor="middle" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">解析门店菜单</text>
  <text x="126" y="404" text-anchor="middle" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">归一化与去重</text>

  <line x1="212" y1="390" x2="234" y2="390" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="238" y="362" width="164" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="386" text-anchor="middle" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">匹配官方营养</text>
  <text x="320" y="404" text-anchor="middle" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">组件命中约 88%</text>

  <line x1="406" y1="390" x2="428" y2="390" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="432" y="362" width="164" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="514" y="386" text-anchor="middle" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">硬约束过滤</text>
  <text x="514" y="404" text-anchor="middle" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">预算 · 忌口 · 可售性</text>

  <line x1="600" y1="390" x2="622" y2="390" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="626" y="362" width="164" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="708" y="386" text-anchor="middle" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">帕累托 + 评分</text>
  <text x="708" y="404" text-anchor="middle" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">三种视角各选一张</text>

  <line x1="794" y1="390" x2="816" y2="390" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="820" y="362" width="136" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="888" y="386" text-anchor="middle" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">可信度分级</text>
  <text x="888" y="404" text-anchor="middle" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">A / B / C / D</text>

  <line x1="500" y1="446" x2="500" y2="474" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 闸门 -->
  <rect x="24" y="480" width="952" height="86" rx="10" style="fill:#fafafa; stroke:#e2e8f0; stroke-width:1.5; stroke-dasharray:5 4" />
  <text x="44" y="506" style="font:600 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#334155; letter-spacing:.02em">三道闸门（宁可说「不知道」，也不填 0 冒充）</text>
  <text x="44" y="534" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">预算：超出不硬凑方案</text>
  <text x="268" y="534" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">可售性：官方判「不可售」直接移出可行集</text>
  <text x="620" y="534" style="font:400 13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#0f172a">下单：未接入，代码里显式关闭</text>
  <text x="44" y="556" style="font:400 11.5px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#64748b">价源四态：official / official-unverified / menu-adjusted-unverified / menu —— 每个金额都能追到它属于哪一态。</text>

  <text x="500" y="600" text-anchor="middle" style="font:400 12px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; fill:#475569">本图只表达数据流，不含任何示意性数值；实际输出见 README 中逐字取自运行的样例</text>
</svg>
